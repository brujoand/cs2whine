requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.2",
    "winotify>=1.1.0",
]

[project.scripts]
cs2coach = "gsi_server:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]
