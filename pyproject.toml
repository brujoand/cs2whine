[project]
name = "cs2whine"
version = "0.2.1"
description = "Real-time CS2 coaching via Game State Integration"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.2",
    "windows-toasts>=1.2.0; sys_platform == 'win32'",
]

[project.scripts]
cs2whine = "gsi_server:main"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyinstaller>=6.19.0",
    "ruff>=0.15.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
