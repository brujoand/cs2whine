name: Build and Release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ inputs.tag || github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --group dev

      - name: Inject version
        shell: python
        run: |
          import re
          from pathlib import Path
          tag = "${{ steps.tag.outputs.name }}"
          version = tag.lstrip("v")
          p = Path("updater.py")
          text = p.read_text()
          text = re.sub(r'^__version__ = .*', f'__version__ = "{version}"', text, flags=re.MULTILINE)
          p.write_text(text)
          print(f"Injected version {version}")

      - name: Build exe
        run: uv run pyinstaller cs2coach.spec

      - name: Rename with version
        shell: bash
        run: |
          version="${{ steps.tag.outputs.name }}"
          mv dist/cs2coach.exe "dist/cs2coach-${version}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs2whine-windows
          path: dist/cs2coach-*.exe

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${{ steps.tag.outputs.name }}" dist/cs2coach-*.exe --clobber
